name: ScientificBrain tests

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Python tests
        run: pytest -q
      - name: API import smoke test
        run: |
          python -c "import api.jobs, api.search, api.run_job, api.paper, api.research, api.science, api.collaboration, api.orchestrate, api.corpus, api.watch_cron"
          python -c "import scientific_brain.nvidia_provider, scientific_brain.physics_tools, scientific_brain.physics_jobs, scientific_brain.google_batch, scientific_brain.google_setup"
          python -c "import scientific_brain.paper_intelligence, scientific_brain.paper_compare, scientific_brain.research_versions, scientific_brain.vision_provider, scientific_brain.corpus_intelligence, scientific_brain.corpus_intelligence_v16, scientific_brain.corpus_intelligence_v19, scientific_brain.literature_watch, scientific_brain.observability, scientific_brain.evidence_bound_collaboration, scientific_brain.telemetry_provider, scientific_brain.quality_control, scientific_brain.professional_exports, scientific_brain.scientific_response, scientific_brain.scientific_notebook, scientific_brain.state_of_art, scientific_brain.autonomous_discovery"
      - name: Frontend JavaScript syntax
        run: |
          node --check assets/i18n.js
          node --check assets/app.js
          node --check assets/app_plus.js
          node --check assets/ux_flow.js
          node --check assets/runtime_stall_guard.js
          node --check assets/ux_flow_base.js
          node --check assets/adaptive_jobs.js
          node --check assets/adaptive_science.js
          node --check assets/adaptive_agents.js
          node --check assets/runtime_repair.js
          node --check assets/research_workspace_v11.js
          node --check assets/research_workspace_v12.js
          node --check assets/research_workspace_v14.js
          node --check assets/research_workspace_v15.js
          node --check assets/research_workspace_v16.js
          node --check assets/research_workspace_v17.js
          node --check assets/research_flow_v18.js
          node --check assets/scientific_format_v19.js
          node --check assets/state_art_map_v20.js
          node --check assets/autonomous_discovery_v21.js
          node --check assets/research_questions_v22.js
          node --check assets/research_questions_v22_gap_mode.js
          node --check assets/scientific_tools.js

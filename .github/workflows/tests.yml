name: ScientificBrain tests

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Python tests
        run: pytest -q
      - name: API import smoke test
        run: |
          python -c "import api.jobs, api.search, api.run_job, api.paper, api.research, api.science, api.collaboration, api.orchestrate, api.corpus, api.watch_cron"
          python -c "import scientific_brain.paper_intelligence, scientific_brain.paper_compare, scientific_brain.research_versions, scientific_brain.vision_provider, scientific_brain.corpus_intelligence, scientific_brain.literature_watch, scientific_brain.observability"
      - name: Frontend JavaScript syntax
        run: |
          node --check assets/i18n.js
          node --check assets/app.js
          node --check assets/app_plus.js
          node --check assets/ux_flow.js
          node --check assets/ux_flow_base.js
          node --check assets/adaptive_jobs.js
          node --check assets/adaptive_science.js
          node --check assets/adaptive_agents.js
          node --check assets/runtime_repair.js
          node --check assets/research_workspace_v11.js
          node --check assets/research_workspace_v12.js
          node --check assets/research_workspace_v14.js

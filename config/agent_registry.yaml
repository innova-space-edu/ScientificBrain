version: 1
principles:
  - every_agent_has_single_primary_responsibility
  - every_output_is_structured_or_evidence_linked
  - self_critique_does_not_replace_independent_review
  - downstream_agents_read_research_state_not_only_previous_prose
  - agents_may_block_progress_when_required_evidence_is_missing
agents:
  - id: research_director
    stage: definition
    task: research
    purpose: Maintain scope, question, objectives, dependencies, decisions and stage transitions.
    inputs: [project_definition, research_state]
    outputs: [validated_scope, work_plan, decision_log]
    required_checks: [scope_consistency, objective_traceability, unresolved_blockers]
    can_block: true
  - id: literature
    stage: literature
    task: long_context
    purpose: Reconstruct the literature landscape without flattening incompatible regimes.
    inputs: [research_question, corpus_policy, discovered_papers]
    outputs: [literature_map, gap_map, source_priorities]
    required_checks: [coverage, recency, foundational_work, contradictory_work, regime_matching]
    can_block: true
  - id: evidence
    stage: literature
    task: structured
    purpose: Convert source material into claims with explicit provenance and epistemic status.
    inputs: [paper_full_text, metadata]
    outputs: [claims, evidence_records, source_pointers]
    required_checks: [claim_to_evidence, provenance, quotation_boundary, inference_labeling]
    can_block: true
  - id: theory
    stage: theory
    task: research
    purpose: Audit governing physics, equations, closures, orderings, limiting cases and conservation.
    inputs: [research_state, theory_models, evidence]
    outputs: [theory_review, regime_constraints, theoretical_predictions]
    required_checks: [dimensions, closures, ordering, conservation, limiting_cases]
    can_block: true
  - id: hypothesis
    stage: hypothesis
    task: research
    purpose: Generate competing falsifiable hypotheses and explicit rejection criteria.
    inputs: [literature_map, theory_review, unresolved_questions]
    outputs: [hypotheses, predictions, rejection_criteria]
    required_checks: [falsifiability, mechanism, observables, competing_explanations]
    can_block: true
  - id: experiment
    stage: design
    task: research
    purpose: Design experiments that discriminate hypotheses rather than merely confirm one.
    inputs: [hypotheses, variables, constraints]
    outputs: [experiment_designs, controls, acceptance_criteria]
    required_checks: [controls, repetitions, confounders, discriminating_power, failure_modes]
    can_block: true
  - id: diagnostics
    stage: design
    task: research
    purpose: Define what each diagnostic actually measures and with what resolution and bias.
    inputs: [experiment_designs, observables]
    outputs: [diagnostic_plan, calibration_plan, resolution_requirements]
    required_checks: [calibration, bandwidth, temporal_resolution, spatial_resolution, perturbation]
    can_block: true
  - id: metrology
    stage: design
    task: structured
    purpose: Quantify uncertainty, detection/quantification limits and calibration traceability.
    inputs: [diagnostic_plan, variables, expected_signals]
    outputs: [uncertainty_budget, lod_loq, propagation_plan]
    required_checks: [random_uncertainty, systematic_uncertainty, propagation, traceability]
    can_block: true
  - id: simulation
    stage: design
    task: code
    purpose: Define and audit numerical models, solvers, convergence, numerical error and validation.
    inputs: [hypotheses, theory_models, parameter_regime]
    outputs: [simulation_plan, convergence_plan, validation_plan]
    required_checks: [resolution, timestep, boundaries, initial_conditions, numerical_error, convergence]
    can_block: true
  - id: data
    stage: analysis
    task: code
    purpose: Transform raw data reproducibly without altering the scientific meaning of measurements.
    inputs: [raw_data, calibration, processing_plan]
    outputs: [processed_data, processing_log, derived_quantities]
    required_checks: [versioned_processing, units, missing_data, outlier_policy, reproducibility]
    can_block: true
  - id: statistics
    stage: analysis
    task: research
    purpose: Quantify variation, effect size, model fit and uncertainty without overstating significance.
    inputs: [processed_data, hypotheses, uncertainty_budget]
    outputs: [statistical_results, sensitivity_analysis, uncertainty_propagation]
    required_checks: [sample_size, assumptions, effect_size, multiple_testing, robustness]
    can_block: true
  - id: alternatives
    stage: interpretation
    task: research
    purpose: Generate physically plausible competing explanations and discriminating tests.
    inputs: [results, theory_review, literature_map]
    outputs: [alternative_explanations, discriminating_observables, falsification_tests]
    required_checks: [physical_plausibility, testability, evidence_for_against]
    can_block: false
  - id: adversarial_critic
    stage: criticism
    task: research
    purpose: Attempt to break the preferred interpretation using evidence gaps and alternative mechanisms.
    inputs: [interpretation, alternatives, evidence, uncertainty_budget]
    outputs: [major_concerns, minor_concerns, required_tests]
    required_checks: [regime_mismatch, hidden_assumptions, causal_overreach, contradictory_evidence]
    can_block: true
  - id: reproducibility
    stage: reproducibility
    task: structured
    purpose: Determine whether an independent group can recreate calculations, simulations and measurements.
    inputs: [methods, data, code, parameters, calibration]
    outputs: [reproducibility_report, missing_artifacts]
    required_checks: [parameters, versions, data_availability, code_availability, acceptance_criteria]
    can_block: true
  - id: writer
    stage: writing
    task: text
    purpose: Convert accepted scientific state into prose without creating new scientific claims.
    inputs: [accepted_research_state, evidence]
    outputs: [manuscript_or_report]
    required_checks: [claim_evidence_links, epistemic_status, limitations, scope]
    can_block: false
  - id: reviewer
    stage: review
    task: structured
    purpose: Perform final peer-review-style audit and route required revisions to responsible agents.
    inputs: [manuscript_or_report, research_state, evidence]
    outputs: [verdict, required_changes, routing]
    required_checks: [originality, theory, methodology, diagnostics, statistics, reproducibility, claims_vs_evidence]
    can_block: true

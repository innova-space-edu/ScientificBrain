[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scientific-brain"
version = "0.24.0"
description = "Evidence-grounded scientific memory and reasoning across research disciplines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "pypdf>=5,<7",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
scientific-brain = "scientific_brain.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
